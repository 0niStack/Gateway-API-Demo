# Host-based routing: only matches requests with "Host: demo.example.com"
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-route-name
  namespace: gateway-demo
spec:
  parentRefs:
    - name: demo-gw
  hostnames:
    - demo.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: demo-app
          port: 80
